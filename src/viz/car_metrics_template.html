<!doctype html>
<!--
研报 CAR 与概念 DAG 指标页面的模板：src/viz/plot_car_metrics.py 把数据（JSON）替换进 __DATA__，
写到 output_dag/experiments/report_car/研报CAR与DAG指标.html。指标：6 个 CAR、6 个换手率、6 个异常换手率、概念 DAG 指标。
三块：说明（可折叠）、任选两个指标的散点图（Pearson / Spearman / OLS 拟合线及其斜率、t 值、p 值，可按 1%/99% 缩尾作图）、逐篇明细表（排序、筛选）。
不依赖外部库，离线可看。
-->
<html lang="zh-CN">
<head>

<title>研报 CAR 与 DAG 指标</title>
<style>

  color-scheme: light;

  --line: #e4e3df; --grid: #eeede9; --axis: #b9b8b2; --series-1: #2a78d6; --series-1-hover: #1f62b3; --ref: #52514e;

}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;

    --line: #34332f; --grid: #2c2b28; --axis: #5a5953; --series-1: #3987e5; --series-1-hover: #64a2ee; --ref: #c3c2b7;
    --fit: #e8794f; --sel-bg: #4a4220;

}

  color-scheme: dark;
  --surface: #1a1a19; --panel: #222220; --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --line: #34332f; --grid: #2c2b28; --axis: #5a5953; --series-1: #3987e5; --series-1-hover: #64a2ee; --ref: #c3c2b7;

}

  font: 14px/1.55 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }

<body>
<div class="wrap">
  <h1>研报 CAR 与概念 DAG 指标</h1>
  <div class="sub" id="sub"></div>

  <details class="card" id="intro" open>
    <summary>说明</summary>
    <dl class="defs" id="defs"></dl>
  </details>

  <div class="card">
    <h2>散点图：任选两个指标</h2>
    <div class="ctrl">
      <label>横轴 x <select id="sx"></select></label>
      <label>纵轴 y <select id="sy"></select></label>
      <label><input type="checkbox" id="cfit" checked> OLS 拟合线</label>
      <label><input type="checkbox" id="cwin"> 按 1%/99% 缩尾后作图</label>
    </div>
    <div class="stats" id="stats"></div>
    <div class="chart" id="chart"></div>
    <div class="note" id="cnote"></div>
  </div>

  <div class="card">
    <h2>逐篇明细</h2>
    <div class="ctrl">
      <label>筛选 <input type="text" id="q" placeholder="输入公司或券商名称（也可输代码）"></label>
      <span class="note" id="qn"></span>
    </div>
    <div class="tablewrap" id="tw"><table class="main" id="tbl"></table></div>
    <div class="note" style="margin-top:6px">点表头排序，再点反向；缺失值总排在最后。点一行会在散点图里标出这篇研报。筛选同时作用于散点图。</div>
  </div>
</div>
<div class="tip" id="tip"></div>
<script>
const DATA = __DATA__;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const fmtDate = d => d && d.length === 8 ? `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6)}` : (d || '');
const R = DATA.rows;
R.forEach((r, i) => { r._i = i; });

// ---------- 指标 ----------
const M = [
  {k: 'CAR_m5_m1', name: 'CAR[-5,-1]', d: 2, car: true, def: '发布前 5 个交易日（第 -5 到 -1 天）的累计超额收益'},
  {k: 'CAR_0_1', name: 'CAR[0,1]', d: 2, car: true, def: '第 0 到 1 天的累计超额收益'},
  {k: 'CAR_0_2', name: 'CAR[0,2]', d: 2, car: true, def: '第 0 到 2 天'},
  {k: 'CAR_0_3', name: 'CAR[0,3]', d: 2, car: true, def: '第 0 到 3 天'},
  {k: 'CAR_0_5', name: 'CAR[0,5]', d: 2, car: true, def: '第 0 到 5 天'},
  {k: 'CAR_0_10', name: 'CAR[0,10]', d: 2, car: true, def: '第 0 到 10 天'},
  // 换手率（%）和异常换手率（比值，0 = 与平时持平）；turn 标记用于说明分组，zero 标记表示作坐标轴时包含 0 并画参考线
  {k: 'TURN_m5_m1', name: '换手率[-5,-1]', d: 2, turn: true, unit: '%', def: '第 -5 到 -1 天未停牌日的日均换手率（%）'},
  {k: 'TURN_0_1', name: '换手率[0,1]', d: 2, turn: true, unit: '%', def: '第 0 到 1 天未停牌日的日均换手率（%）'},
  {k: 'TURN_0_2', name: '换手率[0,2]', d: 2, turn: true, unit: '%', def: '第 0 到 2 天未停牌日的日均换手率（%）'},
  {k: 'TURN_0_3', name: '换手率[0,3]', d: 2, turn: true, unit: '%', def: '第 0 到 3 天未停牌日的日均换手率（%）'},
  {k: 'TURN_0_5', name: '换手率[0,5]', d: 2, turn: true, unit: '%', def: '第 0 到 5 天未停牌日的日均换手率（%）'},
  {k: 'TURN_0_10', name: '换手率[0,10]', d: 2, turn: true, unit: '%', def: '第 0 到 10 天未停牌日的日均换手率（%）'},
  {k: 'ATURN_m5_m1', name: '异常换手率[-5,-1]', d: 2, turn: true, zero: true, def: '换手率[-5,-1] ÷ 基准期日均换手率 − 1'},
  {k: 'ATURN_0_1', name: '异常换手率[0,1]', d: 2, turn: true, zero: true, def: '换手率[0,1] ÷ 基准期日均换手率 − 1'},
  {k: 'ATURN_0_2', name: '异常换手率[0,2]', d: 2, turn: true, zero: true, def: '换手率[0,2] ÷ 基准期日均换手率 − 1'},
  {k: 'ATURN_0_3', name: '异常换手率[0,3]', d: 2, turn: true, zero: true, def: '换手率[0,3] ÷ 基准期日均换手率 − 1'},
  {k: 'ATURN_0_5', name: '异常换手率[0,5]', d: 2, turn: true, zero: true, def: '换手率[0,5] ÷ 基准期日均换手率 − 1'},
  {k: 'ATURN_0_10', name: '异常换手率[0,10]', d: 2, turn: true, zero: true, def: '换手率[0,10] ÷ 基准期日均换手率 − 1'},
  {k: 'RATIO', name: '源汇比', d: 2, def: '源点数 ÷ 汇点数（源点：没有入边的概念；汇点：没有出边的概念）'},
  {k: 'NPATH', name: '路径数', d: 0, def: '从源点沿箭头走到汇点的不同有向路径条数（完整因果链条数）'},
  {k: 'LNPATH', name: 'ln(1+路径数)', d: 2, def: '路径数取对数，ln(1 + 路径数)'},
  {k: 'PATHLEN', name: '平均路径长度', d: 2, def: '所有源到汇路径的平均边数，每条路径权重相同'},
  {k: 'V_HAS', name: '有投资评级', d: 0, def: '图里有没有名称恰好为“投资评级”的概念，有 = 1，没有 = 0（不要求它是汇点）'},
  {k: 'V_NPATH', name: '到投资评级的路径数', d: 0, def: '从源点（不含“投资评级”本身）沿有向边走到“投资评级”、在“投资评级”处结束的不同路径条数；没有“投资评级”或没有源点能走到它时为 0'},
  {k: 'V_LNPATH', name: 'ln(1+到投资评级的路径数)', d: 2, def: 'ln(1 + 到投资评级的路径数)'},
  {k: 'V_PATHLEN', name: '到投资评级的平均路径长度', d: 2, def: '这些路径的平均边数，每条路径权重相同；到投资评级的路径数为 0 时缺失'},
  {k: 'V_RATIO', name: '能走到投资评级的源点数', d: 0, def: '能沿有向边走到“投资评级”的源点个数（目标只有一个节点，源点数 ÷ 1 就是源点数）；没有“投资评级”时缺失'},
];
const MK = Object.fromEntries(M.map(m => [m.k, m]));
const num = (v, d) => v == null || Number.isNaN(v) ? '—' : d === 0 ? Math.round(v).toLocaleString('zh-CN') : v.toFixed(d);
const fv = (k, v) => num(v, MK[k].d);

// ---------- 抬头和说明 ----------
const C = DATA.check;
$('sub').textContent = `${R.length} 篇深度研报 · ${DATA.n_companies} 家公司 · ${DATA.n_brokers} 家券商 · 发布日 ${fmtDate(DATA.date_min)} 至 ${fmtDate(DATA.date_max)} · 本页生成于 ${DATA.generated}`;
const carDefs = M.filter(m => m.car).map(m => `<b>${m.name}</b>：${m.def}`).join('；');
const dagDefs = M.filter(m => !m.car && !m.turn).map(m => `<dt>${esc(m.name)} <code>${m.k}</code></dt><dd>${esc(m.def)}。</dd>`).join('');
$('defs').innerHTML =
  `<dt>样本</dt><dd>${R.length} 篇沪深300 成分股的深度研报（${DATA.n_companies} 家公司、${DATA.n_brokers} 家券商），每篇一个点、一行；全部数值未缩尾（散点图的缩尾复选框只影响作图、相关系数和拟合直线）。</dd>` +
  `<dt>拟合直线的斜率、t 值、p 值</dt><dd>纵轴指标对横轴指标做一元 OLS 回归（含截距），用的是图里画出的点（筛选后、两个指标都不缺失；勾选缩尾时用缩尾后的值）。t 值用普通 OLS 标准误（同方差），<b>没有按公司聚类</b>，自由度为 N − 2，p 值是双侧的；同一家公司的多篇研报并不独立，所以这里的 t 值通常比按公司聚类的偏大，只作快速查看用。</dd>` +
  `<dt>CAR（累计超额收益，单位：百分点）</dt><dd>每天的超额收益 = 个股收益 − 全市场市值加权收益，在窗口内累加。第 0 天是研报发布日，发布日不是交易日时取其后第一个交易日（表中“事件日”）。${carDefs}。</dd>` +
  `<dt>换手率 <code>TURN_*</code>（单位：%）</dt><dd>日换手率 = 成交量 ÷ 总股本 × 100，总股本 = 总市值 ÷ 未复权收盘价；只用未停牌日。第 0 天与 CAR 完全相同。` +
  `窗口也与 CAR 相同：[-5,-1]、[0,1]、[0,2]、[0,3]、[0,5]、[0,10]；换手率[窗口] = 窗口内未停牌日的日均换手率，窗口内一天都没交易则缺失。</dd>` +
  `<dt>异常换手率 <code>ATURN_*</code>（比值）</dt><dd>异常换手率[窗口] = 换手率[窗口] ÷ 基准期日均换手率 − 1；基准期为第 -60 到 -11 天，取其中未停牌日的日均换手率，不足 20 个未停牌日记缺失（这时各窗口的异常换手率都缺失）。` +
  `0 表示与平时持平，0.5 表示比平时高 50%，−0.2 表示低 20%；作坐标轴时画 0 的参考线。异常换手率[0,2] 与回归实验里的 ATURN[0,2] 是同一个变量（未缩尾）。</dd>` +
  `<dt>概念 DAG</dt><dd>每篇研报一张有向无环图：概念为点，因果关系为边（只用进图的边，没有边的孤立概念不算）。源点 = 入度为 0 的概念，汇点 = 出度为 0 的概念；路径 = 源点到汇点的有向路径，长度 = 边数；路径数用动态规划计数。</dd>` +
  dagDefs +
  `<dt>目标节点“${esc(DATA.target)}”的口径</dt><dd>只认名称<b>恰好等于</b>“${esc(DATA.target)}”的那一个概念（精确相等，不做包含匹配；买入评级、目标评级、目标价、估值等一律不算），不要求它是汇点，图里有这个节点就算。` +
  `全部 ${C.n_reports} 篇里 <b>${C.n_reports_with_t}</b> 篇有它，其中 ${C.n_t_sink} 篇它是汇点、${C.n_t_with_out} 篇它还有出边（路径算到它为止，出边不管）；` +
  `<b>${C.n_reports_no_t}</b> 篇没有，这些研报的到投资评级的路径数为 0，平均路径长度和能走到投资评级的源点数缺失。` +
  `（作为参照：全部 ${C.n_reports} 篇共 ${C.n_sinks.toLocaleString('zh-CN')} 个汇点、${C.n_sink_names.toLocaleString('zh-CN')} 个不同名称。）</dd>`;

// ---------- 统计 ----------
const quantile = (sorted, p) => {  // 线性插值（同 numpy / pandas 默认）
  const pos = (sorted.length - 1) * p, lo = Math.floor(pos), hi = Math.ceil(pos);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
};
const rank = xs => {  // 秩（并列取平均秩）
  const idx = xs.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]), out = Array(xs.length);
  for (let i = 0; i < idx.length;) {
    let j = i; while (j + 1 < idx.length && idx[j + 1][0] === idx[i][0]) j++;
    for (let k = i; k <= j; k++) out[idx[k][1]] = (i + j) / 2 + 1;
    i = j + 1;
  }
  return out;
};
const meanOf = a => a.reduce((s, x) => s + x, 0) / a.length;
const pearson = (a, b) => {
  const n = a.length; if (n < 3) return null;
  const ma = meanOf(a), mb = meanOf(b);
  let num = 0, da = 0, db = 0;
  for (let i = 0; i < n; i++) { num += (a[i] - ma) * (b[i] - mb); da += (a[i] - ma) ** 2; db += (b[i] - mb) ** 2; }
  return da && db ? num / Math.sqrt(da * db) : null;
};
const ols = (x, y) => {
  const mx = meanOf(x), my = meanOf(y);
  let sxy = 0, sxx = 0;
  for (let i = 0; i < x.length; i++) { sxy += (x[i] - mx) * (y[i] - my); sxx += (x[i] - mx) ** 2; }
  if (!sxx) return null;
  const b = sxy / sxx, n = x.length, df = n - 2;
  let sse = 0;
  for (let i = 0; i < n; i++) sse += (y[i] - my - b * (x[i] - mx)) ** 2;
  const se = df > 0 ? Math.sqrt(sse / df / sxx) : null;  // 普通 OLS 标准误（同方差）
  const t = se ? b / se : null;
  return {a: my - b * mx, b, se, t, df, p: t == null ? null : tTwoSided(t, df)};
};
// t 分布双侧 p 值：p = I_{df/(df+t²)}(df/2, 1/2)，I 是正则化不完全贝塔函数（连分式展开）
function lgamma(z) {
  const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
  let x = z, y = z, tmp = x + 5.5; tmp -= (x + 0.5) * Math.log(tmp);
  let ser = 1.000000000190015; for (const cj of c) ser += cj / ++y;
  return -tmp + Math.log(2.5066282746310005 * ser / x);
}
function betacf(a, b, x) {
  const FPMIN = 1e-300; let qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap;
  if (Math.abs(d) < FPMIN) d = FPMIN; d = 1 / d; let h = d;
  for (let m = 1; m <= 300; m++) {
    const m2 = 2 * m; let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN; c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN; d = 1 / d; h *= d * c;
    aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN; c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN; d = 1 / d;
    const del = d * c; h *= del; if (Math.abs(del - 1) < 3e-14) break;
  }
  return h;
}
function betai(a, b, x) {
  if (x <= 0) return 0; if (x >= 1) return 1;
  const bt = Math.exp(lgamma(a + b) - lgamma(a) - lgamma(b) + a * Math.log(x) + b * Math.log(1 - x));
  return x < (a + 1) / (a + b + 2) ? bt * betacf(a, b, x) / a : 1 - bt * betacf(b, a, 1 - x) / b;
}
const tTwoSided = (t, df) => betai(df / 2, 0.5, df / (df + t * t));
const sig3 = v => {  // 斜率的量级随指标变化很大，按 3 位有效数字显示
  if (v === 0) return '0';
  const a = Math.abs(v);
  return a >= 1e4 || a < 1e-3 ? v.toExponential(2) : v.toPrecision(3);
};

// ---------- 状态 ----------
const S = {x: 'PATHLEN', y: 'CAR_0_1', fit: true, win: false, q: '', sel: null, sortK: null, sortDir: 1};
const visible = () => {
  const q = S.q.trim().toLowerCase();
  return q ? R.filter(r => (r.company || '').toLowerCase().includes(q) || (r.broker || '').toLowerCase().includes(q) ||
    (r.code || '').includes(q)) : R;
};

// ---------- 下拉框 ----------
['sx', 'sy'].forEach(id => {
  $(id).innerHTML = M.map(m => `<option value="${m.k}">${esc(m.name)}</option>`).join('');
});
$('sx').value = S.x; $('sy').value = S.y;
$('sx').addEventListener('change', e => { S.x = e.target.value; drawChart(); });
$('sy').addEventListener('change', e => { S.y = e.target.value; drawChart(); });
$('cfit').addEventListener('change', e => { S.fit = e.target.checked; drawChart(); });
$('cwin').addEventListener('change', e => { S.win = e.target.checked; drawChart(); });

// ---------- 散点图 ----------
const tip = $('tip');
function showTip(ev, html) {
  tip.innerHTML = html; tip.style.display = 'block';
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.pageX + pad, y = ev.pageY + pad;
  if (x + w > window.scrollX + document.documentElement.clientWidth - 8) x = ev.pageX - w - pad;
  if (y + h > window.scrollY + window.innerHeight - 8) y = ev.pageY - h - pad;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };

function niceTicks(lo, hi, n = 6) {
  if (hi === lo) { hi = lo + 1; lo = lo - 1; }
  const step0 = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), r = step0 / mag;
  const step = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + step * 1e-9; v += step) out.push(+v.toFixed(10));
  return {ticks: out, step};
}
const tickLabel = (t, step) => {
  const dec = Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
  return Math.abs(t) >= 1e4 ? t.toLocaleString('zh-CN') : t.toFixed(Math.min(dec, 4));
};

let PTS = [];  // 当前图里的点：{r, x, y}（作图用的值，缩尾后）
function drawChart() {
  const el = $('chart'), mx = MK[S.x], my = MK[S.y];
  const rows = visible().filter(r => r[S.x] != null && r[S.y] != null);
  let xs = rows.map(r => r[S.x]), ys = rows.map(r => r[S.y]);
  let win = null;
  if (S.win && rows.length > 2) {
    const sx = xs.slice().sort((a, b) => a - b), sy = ys.slice().sort((a, b) => a - b);
    win = {x: [quantile(sx, .01), quantile(sx, .99)], y: [quantile(sy, .01), quantile(sy, .99)]};
    xs = xs.map(v => Math.min(Math.max(v, win.x[0]), win.x[1]));
    ys = ys.map(v => Math.min(Math.max(v, win.y[0]), win.y[1]));
  }
  PTS = rows.map((r, i) => ({r, x: xs[i], y: ys[i]}));
  const n = rows.length, rp = pearson(xs, ys), rs = n > 2 ? pearson(rank(xs), rank(ys)) : null, fit = n > 2 ? ols(xs, ys) : null;
  $('stats').innerHTML = `<span>N = <b>${n}</b></span>` +
    `<span>Pearson r = <b>${rp == null ? '—' : rp.toFixed(3)}</b></span>` +
    `<span>Spearman ρ = <b>${rs == null ? '—' : rs.toFixed(3)}</b></span>` +
    `<span title="y 对 x 的一元 OLS 回归（含截距）的斜率">拟合直线斜率 = <b>${fit ? sig3(fit.b) : '—'}</b></span>` +
    `<span title="普通 OLS 标准误（同方差），没有按公司聚类；自由度 N − 2">t = <b>${fit && fit.t != null ? fit.t.toFixed(2) : '—'}</b></span>` +
    `<span title="双侧 p 值，t 分布，自由度 N − 2">p ${fit && fit.p != null && fit.p < 0.001 ? '&lt;' : '='} <b>${fit && fit.p != null ? (fit.p < 0.001 ? '0.001' : fit.p.toFixed(3)) : '—'}</b></span>`;
  const nMiss = visible().length - n;
  $('cnote').textContent = (nMiss ? `另有 ${nMiss} 篇 x 或 y 缺失，未画。` : '') +
    (win ? `已缩尾（在当前 ${n} 篇里取分位数）：x 截在 ${fv(S.x, win.x[0])} ~ ${fv(S.x, win.x[1])}，y 截在 ${fv(S.y, win.y[0])} ~ ${fv(S.y, win.y[1])}；悬停显示的是原值。` : '');

  const W = Math.max(320, el.clientWidth), narrow = W < 560;
  const H = Math.round(Math.min(560, Math.max(300, W * 0.56)));
  const L = narrow ? 52 : 66, Rm = 16, T = 12, B = 48, pw = W - L - Rm, ph = H - T - B;
  if (!n) { el.innerHTML = `<svg viewBox="0 0 ${W} 80"><text x="${W / 2}" y="40" text-anchor="middle">没有可画的研报</text></svg>`; return; }
  const ext = (a, isCar) => {
    let lo = Math.min(...a), hi = Math.max(...a);
    if (isCar) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    const pad = (hi - lo || 1) * 0.04; return [lo - pad, hi + pad];
  };
  const zx = mx.car || mx.zero, zy = my.car || my.zero;  // CAR 和异常换手率：坐标轴包含 0 并画参考线
  const unit = m => m.car ? '（百分点）' : m.unit ? `（${m.unit}）` : '';
  const [x0, x1] = ext(xs, zx), [y0, y1] = ext(ys, zy);
  const X = v => L + pw * (v - x0) / (x1 - x0), Y = v => T + ph * (1 - (v - y0) / (y1 - y0));
  const tx = niceTicks(x0, x1, narrow ? 4 : 7), ty = niceTicks(y0, y1, 6);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(mx.name)} 与 ${esc(my.name)} 的散点图">`;
  tx.ticks.filter(t => t >= x0 && t <= x1).forEach(t => {
    s += `<line class="grid" x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${T + ph}"/>` +
      `<text class="tick" x="${X(t)}" y="${T + ph + 15}" text-anchor="middle">${tickLabel(t, tx.step)}</text>`;
  });
  ty.ticks.filter(t => t >= y0 && t <= y1).forEach(t => {
    s += `<line class="grid" x1="${L}" x2="${L + pw}" y1="${Y(t)}" y2="${Y(t)}"/>` +
      `<text class="tick" x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${tickLabel(t, ty.step)}</text>`;
  });
  s += `<line class="axis" x1="${L}" x2="${L + pw}" y1="${T + ph}" y2="${T + ph}"/><line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${T + ph}"/>`;
  if (zx && x0 < 0 && x1 > 0) s += `<line class="ref" x1="${X(0)}" x2="${X(0)}" y1="${T}" y2="${T + ph}"/>`;
  if (zy && y0 < 0 && y1 > 0) s += `<line class="ref" x1="${L}" x2="${L + pw}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  s += `<text class="lbl" x="${L + pw / 2}" y="${H - 6}" text-anchor="middle">${esc(mx.name)}${unit(mx)}</text>` +
    `<text class="lbl" transform="translate(13,${T + ph / 2}) rotate(-90)" text-anchor="middle">${esc(my.name)}${unit(my)}</text>`;
  s += '<g id="pts">';
  const rad = n > 400 ? 3.2 : 4;
  let selIdx = -1;
  PTS.forEach((p, i) => {
    if (S.sel === p.r._i) { selIdx = i; return; }
    s += `<circle class="pt" data-i="${i}" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${rad}"/>`;
  });
  if (selIdx >= 0) { const p = PTS[selIdx]; s += `<circle class="pt on" data-i="${selIdx}" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="6.5"/>`; }
  s += '</g>';
  if (S.fit && fit) {
    const a = Math.min(...xs), b = Math.max(...xs);
    s += `<line class="fit" x1="${X(a)}" x2="${X(b)}" y1="${Y(fit.a + fit.b * a)}" y2="${Y(fit.a + fit.b * b)}"/>`;
  }
  el.innerHTML = s + '</svg>';
}
const chartEl = $('chart');
chartEl.addEventListener('mousemove', ev => {
  const i = ev.target.dataset && ev.target.dataset.i;
  if (i == null) { hideTip(); return; }
  const r = PTS[+i].r;
  showTip(ev, `<b>${esc(r.company)}</b> <span class="m">${esc(r.code)}</span><br>${esc(r.broker)} · 发布 ${fmtDate(r.date)}<br>` +
    `${esc(MK[S.x].name)}：<b>${fv(S.x, r[S.x])}</b><br>${esc(MK[S.y].name)}：<b>${fv(S.y, r[S.y])}</b>` +
    `<br><span class="m">点击在下方表格中定位</span>`);
});
chartEl.addEventListener('mouseleave', hideTip);
chartEl.addEventListener('click', ev => {
  const i = ev.target.dataset && ev.target.dataset.i;
  if (i == null) return;
  select(PTS[+i].r._i, true);
});

// ---------- 表格 ----------
const COLS = [
  {k: 'company', name: '公司', t: true}, {k: 'code', name: '代码', t: true}, {k: 'broker', name: '券商', t: true},
  {k: 'date', name: '发布日', t: true}, {k: 'day0', name: '事件日', t: true},
  ...M.map(m => ({k: m.k, name: m.name, d: m.d, car: m.car})),
];
function renderHead() {
  $('tbl').querySelector('thead')?.remove();
  const th = COLS.map(c => `<th class="${c.t ? 't' : ''}" data-k="${c.k}" title="${esc(MK[c.k]?.def || '')}">${esc(c.name)}` +
    `<span class="ar">${S.sortK === c.k ? (S.sortDir > 0 ? '▲' : '▼') : ''}</span></th>`).join('');
  $('tbl').insertAdjacentHTML('afterbegin', `<thead><tr>${th}</tr></thead>`);
  $('tbl').querySelectorAll('th').forEach(h => h.addEventListener('click', () => {
    const k = h.dataset.k;
    if (S.sortK === k) S.sortDir = -S.sortDir; else { S.sortK = k; S.sortDir = COLS.find(c => c.k === k).t ? 1 : -1; }
    renderHead(); renderBody();
  }));
}
function cell(c, r) {
  const v = r[c.k];
  if (c.k === 'date' || c.k === 'day0') return `<td class="t">${esc(fmtDate(v))}</td>`;
  if (c.t) return `<td class="t">${esc(v ?? '—')}</td>`;
  const cls = c.car && v != null ? (v < 0 ? 'neg' : v > 0 ? 'pos' : '') : '';
  return `<td class="${cls}">${num(v, c.d)}</td>`;
}
function renderBody() {
  let rows = visible().slice();
  if (S.sortK) {
    const k = S.sortK, isT = COLS.find(c => c.k === k).t, dir = S.sortDir;
    rows.sort((a, b) => {
      const va = a[k], vb = b[k], ma = va == null || va === '', mb = vb == null || vb === '';
      if (ma || mb) return ma === mb ? 0 : ma ? 1 : -1;
      return dir * (isT ? String(va).localeCompare(String(vb), 'zh-CN') : va - vb);
    });
  }
  const tb = $('tbl').querySelector('tbody'), html = rows.map(r =>
    `<tr id="row-${r._i}" data-i="${r._i}" class="${S.sel === r._i ? 'sel' : ''}">${COLS.map(c => cell(c, r)).join('')}</tr>`).join('');
  if (tb) tb.innerHTML = html; else $('tbl').insertAdjacentHTML('beforeend', `<tbody>${html}</tbody>`);
  $('qn').textContent = S.q.trim() ? `${rows.length} / ${R.length} 篇` : `共 ${R.length} 篇`;
}
$('tbl').addEventListener('click', ev => {
  const tr = ev.target.closest('tbody tr');
  if (tr) select(+tr.dataset.i, false);
});
function select(i, scroll) {
  S.sel = S.sel === i && !scroll ? null : i;
  document.querySelectorAll('#tbl tbody tr.sel').forEach(tr => tr.classList.remove('sel'));
  const tr = $('row-' + i);
  if (tr && S.sel === i) {
    tr.classList.add('sel');
    if (scroll) {  // 只滚动表格容器，再把表格滚进视野
      const tw = $('tw'), head = tw.querySelector('thead').offsetHeight;
      tw.scrollTop += tr.getBoundingClientRect().top - tw.getBoundingClientRect().top - head - (tw.clientHeight - head) / 2 + tr.offsetHeight / 2;
      tw.scrollIntoView({block: 'nearest', behavior: 'smooth'});
    }
  }
  drawChart();
}
let qt;
$('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value; renderBody(); drawChart(); }, 120); });

renderHead(); renderBody(); drawChart();
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawChart, 120); });
</script>
</body>
